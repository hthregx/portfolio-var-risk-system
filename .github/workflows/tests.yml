name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  phase2-foundation:
    if: startsWith(github.head_ref || github.ref_name, 'phase2/')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Phase 2 foundation dependencies
        run: |
          python -m pip install numpy==2.2.6 pandas==2.3.3 PyYAML==6.0.3 pytest==9.1.1

      - name: Run Phase 2 foundation tests
        run: |
          python -m pytest tests/test_phase2*.py -q

  legacy-tests:
    if: ${{ !startsWith(github.head_ref || github.ref_name, 'phase2/') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run tests
        run: |
          python -m pytest -q