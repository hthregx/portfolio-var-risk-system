name: Phase 2 Cloud EOD

on:
  push:
    branches:
      - phase2/cloud-eod-setup
    paths:
      - .github/workflows/phase2-cloud-eod.yml
  workflow_dispatch:
  schedule:
    # 18:37 Vietnam time (UTC+7), Monday-Friday.
    - cron: "37 11 * * 1-5"

permissions:
  contents: read

jobs:
  cloud-eod:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Phase 2
        uses: actions/checkout@v4
        with:
          ref: phase2/develop
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lightweight dependencies
        run: |
          python -m pip install \
            numpy==2.2.6 \
            pandas==2.3.3 \
            PyYAML==6.0.3 \
            pytest==9.1.1

      - name: Verify Phase 2 tests
        run: |
          python -m pytest tests/test_phase2*.py -q -W error

      - name: Run KBS daily EOD pipeline
        run: |
          python -m scripts.run_phase2_scheduled_eod

      - name: Upload market data and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase2-eod-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            data/phase2/market/
            data/phase2/portfolio_returns.csv
            data/phase2/quality/
            data/phase2/latest_manifest.json
            data/phase2/logs/
            data/phase2/raw_snapshots/
