name: Phase 2 Cloud EOD

on:
  push:
    branches:
      - phase2/cloud-eod-setup
      - phase2/cloud-eod-repair
      - main
    paths:
      - .github/workflows/phase2-cloud-eod.yml
  workflow_dispatch:
  schedule:
    # 18:37 Vietnam time (UTC+7), Monday-Friday.
    - cron: "37 11 * * 1-5"

permissions:
  contents: read

jobs:
  cloud-eod:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Phase 2
        uses: actions/checkout@v4
        with:
          ref: phase2/develop
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lightweight dependencies
        run: |
          python -m pip install \
            numpy==2.2.6 \
            pandas==2.3.3 \
            PyYAML==6.0.3 \
            pytest==9.1.1

      - name: Verify Phase 2 tests
        run: |
          python -m pytest tests/test_phase2*.py -q -W error

      - name: Run verified KBS EOD pipeline
        run: |
          python - <<'PY'
          import hashlib
          import json
          from datetime import datetime
          from pathlib import Path

          from src.phase2.daily_data import (
              TZ,
              SYMBOLS,
              eligible_session,
              run_daily,
          )
          from src.phase2.eod_automation import write_event

          root = Path.cwd()
          now = datetime.now(TZ)
          expected = eligible_session(now).isoformat()

          event = {
              "started_at": now.isoformat(),
              "expected_cutoff": expected,
              "source": "KBS",
              "environment": "github_actions",
              "status": "STARTED",
          }

          try:
              result = run_daily(root, now=now)

              if result["cutoff"] != expected:
                  raise RuntimeError("Unexpected EOD cutoff")

              if result["portfolio_last_date"] != expected:
                  raise RuntimeError("Portfolio data is stale")

              for symbol in SYMBOLS:
                  actual = result["symbols"][symbol]["last_date"]

                  if actual != expected:
                      raise RuntimeError(
                          f"{symbol}: stale data {actual}, expected {expected}"
                      )

              base = root / "data" / "phase2"

              portfolio = base / "portfolio_returns.csv"
              manifest_path = base / "latest_manifest.json"

              if not portfolio.is_file() or not manifest_path.is_file():
                  raise RuntimeError("Missing required output files")

              manifest = json.loads(
                  manifest_path.read_text(encoding="utf-8")
              )

              digest = hashlib.sha256(
                  portfolio.read_bytes()
              ).hexdigest()

              if digest != manifest["portfolio_sha256"]:
                  raise RuntimeError("Portfolio checksum mismatch")

              if manifest["cutoff"] != expected:
                  raise RuntimeError("Published manifest is stale")

              event.update(
                  status="SUCCESS",
                  cutoff=expected,
                  portfolio_last_date=result["portfolio_last_date"],
                  rows=result["rows"],
                  portfolio_sha256=digest,
              )

          except Exception as error:
              event.update(
                  status="FAILED",
                  error_type=type(error).__name__,
                  error=str(error),
              )

              write_event(root, event)

              print(
                  "CLOUD_EOD_FAILED",
                  json.dumps(event, ensure_ascii=False),
                  flush=True,
              )

              raise

          write_event(root, event)

          print(
              "CLOUD_EOD_SUCCESS",
              json.dumps(event, ensure_ascii=False),
              flush=True,
          )
          PY

      - name: Upload market data and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase2-eod-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            data/phase2/market/
            data/phase2/portfolio_returns.csv
            data/phase2/quality/
            data/phase2/latest_manifest.json
            data/phase2/logs/
            data/phase2/raw_snapshots/
