contract:
  name: day21_common_walk_forward_evaluation
  status: pre_model_freeze_evaluation
  purpose: common_three_method_evaluation
  confidence_level: 0.95
  alpha: 0.05
  forecast_horizon: 1
  target: portfolio_simple_return
  portfolio: equal_weight_HPG_FPT_MWG

evaluation_period:
  start: "2024-12-18"
  end: "2026-07-28"
  label: reserved_later_robustness
  used_for_parameter_selection: false
  pristine_untouched_test_claim: false
  note: >
    This period was reserved from the documented validation-based parameter
    selection, but it must not be described as a pristine untouched test set
    because the broader evaluation sample had been inspected previously.

rules:
  forecast_target_alignment: forecast_date_before_target_date
  violation: actual_return < quantile_return
  var: max(0, -quantile_return)
  common_target_dates_required: true
  actual_return_must_match_across_methods: true

historical_simulation:
  selection_status: retained_validation_supported_baseline
  window: 250
  mode: rolling
  alpha: 0.05

ewma:
  evaluation_status: retained_canonical_production_baseline
  decay: 0.94
  mode: expanding
  alpha: 0.05
  initialization: first_squared_return
  distribution: normal
  mean_assumption: zero
  validation_selected_alternative:
    decay: 0.90
    adopted_for_day21_evaluation: false
  note: >
    Decay 0.90 produced stronger validation evidence, while decay 0.94 remains
    the retained canonical production baseline for continuity. Retaining 0.94
    must not be interpreted as a validation win over 0.90.

gradient_boosting:
  experiment_id: G04
  selection_status: validation_candidate_a_slice
  model_frozen: false
  loss: quantile
  alpha: 0.05
  n_estimators: 100
  learning_rate: 0.03
  max_depth: 2
  min_samples_leaf: 5
  subsample: 1.0
  random_state: 42
  training_protocol: expanding_refit_each_target
  features:
    - return_lag_1
    - return_lag_2
    - return_lag_5
    - rolling_vol_5
    - rolling_vol_20
    - rolling_vol_60
    - drawdown
  excluded_unimplemented_feature_families:
    - price_range
    - trading_volume
    - market_index
  note: >
    G04 is the selected A-slice validation candidate among G01-G04.
    No G05-G07 implementation or result artifact is present in the audited
    repository state, so this configuration must not yet be described as the
    frozen final G01-G07 winner.

reproducibility:
  random_state: 42
  source_branch: feature/final-walk-forward-a
