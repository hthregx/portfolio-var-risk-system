project:
  name: portfolio-var-risk-system
  start_date: "2026-07-27"
  end_date: "2026-09-02"

data:
  tickers:
    - HPG
    - FPT
    - MWG

  include_market_index: true
  market_index: VNINDEX

  source: KBS
  interval: d

  start_date: "2020-01-01"

  # Đang làm sớm task 30/07 vào sáng 29/07,
  # nên chỉ dùng ngày giao dịch đã hoàn thành.
  end_date: "2026-07-28"

  raw_directory: data/raw
  processed_directory: data/processed
  sample_directory: data/sample

  sample_rows: 10

  # Giá KBS có thể được biểu diễn theo đơn vị nghìn VND.
  price_unit: thousand_vnd

portfolio:
  default_weights:
    HPG: 0.333333
    FPT: 0.333333
    MWG: 0.333334

risk:
  confidence_level: 0.95
  quantile_alpha: 0.05
  forecast_horizon: 1

models:
  historical_simulation:
    enabled: true
    window: 250

  ewma:
    enabled: true
    decay_factor: 0.94

  gradient_boosting_quantile:
    enabled: true
    alpha: 0.05
    random_state: 42