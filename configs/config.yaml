  forecast_horizon: 1

models:
  historical_simulation:
    enabled: true
    window: 250

  ewma:
    enabled: true
    decay_factor: 0.94

  gradient_boosting_quantile:
    enabled: true
    alpha: 0.05
    random_state: 42