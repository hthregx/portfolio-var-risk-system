project:
  name: portfolio-var-risk-system
  start_date: "2026-07-27"
  end_date: "2026-09-02"

data:
  tickers:
    - HPG
    - FPT
    - MWG

  market_index: VNINDEX
  frequency: 1D
  start_date: "2020-01-01"
  raw_directory: data/raw
  processed_directory: data/processed

portfolio:
  default_weights:
    HPG: 0.333333
    FPT: 0.333333
    MWG: 0.333334

risk:
